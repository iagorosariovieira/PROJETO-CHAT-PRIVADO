<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <style>
        *{
            margin:0px;
            font-family: "Source Code Pro";
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            min-height: 100vh;

            background-image: url(images/fundodragon.png);
            background-repeat: no-repeat;
            background-size: cover;
            
            
            
        }

        #main{ 
            display: flex;
            flex-direction: column;
            gap: 10px;

            width: 400px;
            border-radius: 10px;
            padding: 20px;
            background-color: rgba(128, 128, 128, 0.308);
            box-shadow: 10px 10px 15px;
            background-repeat: no-repeat;
            background-size: cover;
            /*escala a imagem e os itens dela*/
            transform: scale(1.2);
            
          
        }
        #btnlogin{
            display: flex;
            align-self: center;
            justify-content: center;
            padding: 5px;
            font-size: 15px;
            width: 200px;
        }

        #dragon{
       
            width: 100px;
            /*Alinha ele mesmo*/
            align-self: center;

        }

        #texto{
            color: white;
        }

        #cadastro{
            color: white;
        }

        #btncadastro{
            border-radius:5px;
            background-color: rgba(0, 0, 0, 0.993);
            color: white;
        }

        #text-up{
            color: white;
            margin: 100px;
            font-size: 20px;
        }

        #nomesite{
            color: gray;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif
        
        }

    <div id="text-up">
     <h1>Sejam bem vindos ao <h1 id="nomesite">DESCOTECA!</h1></h1>
    <h1>O Discord chora</h1>
    </div>
    
    
    <div id="main">
        <img id="dragon" src="images/dragon.png" alt="logo do site">
        <p id="texto">LOGIN</p>
        <input type="email" placeholder="E-mail">
        <p id="texto">SENHA</p>
        <input type="text" placeholder="Senha">
        <button id="btnlogin">LOGIN</button>
        <p id="cadastro">Sem conta?<button id="btncadastro">Cadastre-se</button></p>
    </div>
