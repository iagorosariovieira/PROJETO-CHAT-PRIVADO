<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descoteca</title>
    <link rel="icon" href="images/dragon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <style>
        *{
            margin:0px;
            font-family: "Source Code Pro";
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            min-height: 100vh;
            background-image: url(images/fundodragon.png);
            background-repeat: no-repeat;
            background-size: cover;
            
            
            
        }

        #main{ 
            display: flex;
            flex-direction: column;
            gap: 10px;

            width: 400px;
            border-radius: 10px;
            padding: 20px;
            background-color: rgba(128, 128, 128, 0.219);
            box-shadow: 10px 10px 15px;
            background-repeat: no-repeat;
            background-size: cover;
            /*escala a imagem e os itens dela*/
            transform: scale(1.2);
            
          
        }
        #btnlogin{
            display: flex;
            align-self: center;
            justify-content: center;
            padding: 5px;
            font-size: 15px;
            width: 200px;
            cursor: pointer;
            border-radius: 100px;
        }

        #dragon{
       
            width: 100px;
            /*Alinha ele mesmo*/
            align-self: center;

        }

        .texto{
            color: white;
        }

        #cadastro{
            color: white;
            font-size: 12 ;
            
            
        }

        #btncadastro{
            border-radius:5px;
            color: rgb(24, 190, 255);
            cursor: pointer;
            text-decoration: underline;
            transition: all 0.25s ease;
            font-size: 12px;
            
        }

        #btncadastro:hover{
            color: rgb(64, 119, 238);
        }

        #text-up{
            color: white;
            margin: 100px;
            font-size: 20px;
        }

        #nomesite{
            color: gray;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            text-decoration: underline;
            
            
        
        }
      


        #cadastro-things{
            display: flex;
            gap: 2px;
            color: white;
        
            
        }

        input{
            border-radius: 100px;
            padding: 5px;
        }


      
    </style>


</head>
<body>
    <div id="text-up">
     <h1>Sejam bem vindos ao <h1 id="nomesite">DESCOTECA!</h1></h1>
    <h1>O Discord chora</h1>
    </div>
    
    
    <div id="main">
        <img id="dragon" src="images/dragon.png" alt="logo do site">
        <p class="texto">LOGIN</p>
        <input type="email" placeholder="E-mail">
        <p class="texto">SENHA</p>
        <input type="password" placeholder="Senha">
        <button id="btnlogin">LOGIN</button>
        <div id="cadastro-things">
            <p id="cadastro">Não possui uma conta?</p>
            <a href = cadastro.html id="btncadastro">Cadastre-se</a>

        </div>
        
    </div>
    
</body>
</html>
